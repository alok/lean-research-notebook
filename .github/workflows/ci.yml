name: Reproduce checked research loop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies
        run: lake update
      - name: Reproduce and render
        run: python3 scripts/reproduce.py
      - name: Mutation and numerical tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify provenance after tests
        run: python3 scripts/reproduce.py --verify-only
      - name: Upload inspected notebook and evidence
        uses: actions/upload-artifact@v4
        with:
          name: checked-research-notebook
          path: |
            _out/html-single/
            _out/run/
            _out/Research.lean
          if-no-files-found: error
